# Utils packages: single job runs scripts/ci/run-utils-all-ci.sh (submodule acp-llm-cli skipped; it has its own CI).
name: Utils-all CI

on:
  push:
    branches: [main]
    paths:
      - "utils/**"
      - "scripts/ci/**"
      - ".github/workflows/utils-all-ci.yml"
      - ".gitmodules"
  pull_request:
    branches: [main]
    paths:
      - "utils/**"
      - "scripts/ci/**"
      - ".github/workflows/utils-all-ci.yml"
      - ".gitmodules"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Check no file: dependencies in publishable packages
        run: node scripts/ci/check-no-file-deps.js

      - name: Run utils CI (all packages)
        run: bash scripts/ci/run-utils-all-ci.sh
