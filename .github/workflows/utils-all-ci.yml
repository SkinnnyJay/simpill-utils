# Utils packages: single job runs scripts/ci/run-utils-all-ci.sh (submodule acp-llm-cli skipped; it has its own CI).
name: Utils-all CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "utils/**"
      - "scripts/ci/**"
      - ".github/workflows/utils-all-ci.yml"
      - ".gitmodules"
      - "tsconfig.base.json"
      - "jest.config.base.js"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "utils/**"
      - "scripts/ci/**"
      - ".github/workflows/utils-all-ci.yml"
      - ".gitmodules"
      - "tsconfig.base.json"
      - "jest.config.base.js"
      - "package-lock.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      # Inter-package deps use file:../ in-repo (required for utils CI). Publish
      # rewrites them to ^versions; scripts/publish/publish-all.sh gates that.

      - name: Install root deps (for audit; acp via submodule file:)
        run: npm ci

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=critical

      # Root node_modules/@simpill/* are published tarballs. Package CI uses
      # file: siblings; if root packages remain, tsc/jest resolve the npm
      # copies and miss local builds (and base outDir used to emit to root).
      - name: Clear root install (avoid shadowing local file: packages)
        run: rm -rf node_modules

      - name: Run utils CI (all packages)
        run: bash scripts/ci/run-utils-all-ci.sh
