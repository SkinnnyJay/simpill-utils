# Monolith (root): typecheck, test. Runs on push when root files change.
name: "Monolith CI"

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "index.ts"
      - "scripts/**"
      - "__tests__/**"
      - ".github/workflows/monolith-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "index.ts"
      - "scripts/**"
      - "__tests__/**"
      - ".github/workflows/monolith-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 dropped: several packages require Node 20+ (next@16, vitest@4, faker@10).
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
