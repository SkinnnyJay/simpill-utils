[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ltr"
version = "1.0.0"
description = "Lumen Token Reducer -- strictly lossless prompt/context reduction (selection + dedup + proven re-encoding)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lumen Industries", email = "lumen@lumennode.uk" }]
dependencies = []

[project.scripts]
ltr = "ltr.cli:main"

[tool.setuptools]
packages = ["ltr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
